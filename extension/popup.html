<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: 'Segoe UI', Inter, Roboto, sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
      color: #1a3a5c;
    }

    .header {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .icon {
      font-size: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header .subtitle {
      font-size: 11px;
      opacity: 0.8;
    }

    .content {
      padding: 16px 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 500;
    }

    .status .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
    }

    .status .dot.offline {
      background: #ef5350;
    }

    .url-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #bbdefb;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input:focus {
      border-color: #42a5f5;
    }

    .btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer {
      padding: 10px 20px;
      text-align: center;
      font-size: 11px;
      color: #78909c;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">⬇️</span>
    <div>
      <h1>UDM</h1>
      <div class="subtitle">Ultimate Download Manager</div>
    </div>
  </div>

  <div class="content">
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>

    <input
      type="text"
      class="url-input"
      id="urlInput"
      placeholder="Paste download URL here..."
    />

    <button class="btn" id="downloadBtn">⬇️  Send to UDM</button>
  </div>

  <div class="footer">
    Right-click any link → "Download with UDM"
  </div>

  <script src="popup.js"></script>
</body>
</html>
